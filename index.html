<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>
    <body>
        <a-scene>
        <a-sky color="gray"></a-sky>
        <a-camera position="0 0 4"><a-cursor fuse="true" fuse-timeout="500"></a-cursor></a-camera>
        
        <a-sphere
        position="0 1 -5"
        color="rgb(0, 0, 0)"
        radius="1"
        height="1"
        id="bomb"
        
        
        animation="
        property: scale;
        from: 1 1 1;
        to: 7 7 7;
        dur: 1;
        startEvents: click;
        "
        animation__2="
        property: color;
        from: rgb(0, 0, 0);
        to: rgb(255, 0, 0);
        dur: 1;
        startEvents: click;
        "
        animation__3="property: position; from: -7 2 -5; to: 0 1 -3; dur: 3000; dir: alternate; loop: true
        "
        
       
        
        ></a-sphere>
        <a-plane
        position="0 -1 -3"
        height="25"
        width="25"
        color="green"
        rotation="-90 0 0"
       
        
        
        
        
        
        
        ></a-plane>
        
       <a-sphere
      radius="1"
      color="gray"
      position="-6 0 -5"
      
      animation="property: position; from: -6 0 -5; to: 0 1 -2; dur: 3000; dir: alternate; loop: true"
      
      animation__2="
      property: opacity;
      from: 1;
      to: 0;
      dur: 200;
      startEvents: click;">
    </a-sphere>

    <a-sphere
      radius="1"
      color="gray"
      position="-4 0 -5"
      animation="property: position; from: -4 0 -5; to: -2 3 -9; dur: 3000; dir: alternate; loop: true"
      animation__2="
      property: opacity;
      from: 1;
      to: 0;
      dur: 200;
      startEvents: click;">>
    </a-sphere>

    <a-sphere
      radius="1"
      color="gray"
      position="-2 0 -5"
      animation="property: position; from: -2 0 -5; to: 3 1 -8; dur: 3000; dir: alternate; loop: true"
      animation__2="
      property: opacity;
      from: 1;
      to: 0;
      dur: 200;
      startEvents: click;">>
    </a-sphere>

    <a-sphere
      radius="1"
      color="gray"
      position="2 0 -5"
      animation="property: position; from: 2 0 -5; to: 4 3 -1; dur: 3000; dir: alternate; loop: true"
      animation__2="
      property: opacity;
      from: 1;
      to: 0;
      dur: 200;
      startEvents: click;">>
    </a-sphere>

    <a-sphere
      radius="1"
      color="gray"
      position="4 0 -5"
      animation="property: position; from: 4 0 -5; to: 1 2 -2; dur: 3000; dir: alternate; loop: true"
      animation__2="
      property: opacity;
      from: 1;
      to: 0;
      dur: 200;
      startEvents: click;">>
    </a-sphere>

    <a-sphere
      radius="1"
      color="gray"
      position="6 0 -5"
      animation="property: position; from: 6 0 -5; to: -6 0 -5; dur: 3000; dir: alternate; loop: true"
      animation__2="
      property: opacity;
      from: 1;
      to: 0;
      dur: 200;
      startEvents: click;">>
    </a-sphere>

        </a-scene>
        <script> 
const scene = document.querySelector('a-scene'); 
const box = document.querySelector('#bomb'); 
const rand = (min, max) => min + Math.random() * (max - min); 

function moveToRandom() {
box.setAttribute('animation', { 
property: 'position', to: ${rand(-4, 4)} ${rand(0.5, 3)} ${rand(-8, -2)}, 
dur: 2000, easing: 'easeInOutQuad' 
}); } 

// Start the next move whenever the current one finishes 
box.addEventListener('animationcomplete', moveToRandom); 

if (scene.hasLoaded) 
{ 
moveToRandom(); 
} 
else 
{ 
scene.addEventListener('loaded', moveToRandom); 
} 
</script> 


        
        
    </body>
</html>
